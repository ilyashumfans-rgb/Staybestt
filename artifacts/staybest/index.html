    <!--
      The mobile capability is a URL fragment, but even a fragment should not
      remain in browser history while the app bundle and its providers boot.
      Keep this tiny route guard before any module or third-party resource.
      The non-enumerable handoff is consumed and deleted by the hosted page
      module before Razorpay Checkout is ever loaded.
    -->
    <script>
      (() => {
        const pathname = window.location.pathname.replace(/\/+$/, "") || "/";
        if (pathname !== "/mobile-payment" && !pathname.endsWith("/mobile-payment")) return;

        const token = new URLSearchParams(window.location.hash.slice(1)).get("token")?.trim() || "";
        window.history.replaceState(null, document.title, pathname);
        if (!token || token.length > 512) return;

        Object.defineProperty(window, "__mobileCheckoutCapability", {
          configurable: true,
          enumerable: false,
          value: token,
          writable: false,
        });
      })();
    </script>
