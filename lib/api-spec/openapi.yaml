      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create an authenticated 15-minute payment hold
      description: >
        Requires an authenticated booking owner. The server rechecks the
        property, room, prices, guest limits and room-count availability. New
        bookings are pending_payment with no public booking reference until a
        captured Razorpay payment is verified.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Pending payment hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: No availability for the requested dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for the signed-in user (or a guest email)
      parameters:
        - name: email
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /bookings/{id}:
    get:
      operationId: getBookingById
      tags: [bookings]
      summary: Booking details by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: email
          in: query
          description: Guest lookup requires this together with bookingRef.
          schema: { type: string }
        - name: bookingRef
          in: query
          description: High-entropy booking reference required with email for guest lookup.
          schema: { type: string }
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCancel"
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{id}/razorpay/order:
    post:
      operationId: createRazorpayOrder
      tags: [bookings]
      summary: Create or reuse a Razorpay order for an owned payment hold or legacy confirmed booking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Razorpay checkout order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayOrder" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "409":
          description: Booking cannot accept an online payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "503":
          description: Razorpay is not configured or unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /bookings/{id}/razorpay/verify:
    post:
      operationId: verifyRazorpayPayment
      tags: [bookings]
      summary: Verify a Razorpay checkout result and record a captured payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RazorpayVerifyInput" }
      responses:
        "200":
          description: Verified payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayPaymentStatus" }
        "400":
          description: Invalid signature or provider payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /bookings/{id}/razorpay/status:
    get:
      operationId: getRazorpayPaymentStatus
      tags: [bookings]
      summary: Reconcile a Razorpay order after a browser-close
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayPaymentStatus" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /bookings/{id}/razorpay/mobile-session:
    post:
      operationId: createRazorpayMobileSession
      tags: [bookings]
      summary: Mint a single-use hosted-browser Razorpay mobile capability
      description: >
        Requires the authenticated booking owner. The returned opaque token is
        valid for 15 minutes and is intended for a URL fragment only. The
        optional URL is returned only when the server has a validated official
        mobile-payment origin configured. No booking id or Clerk token is put
        in that URL.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Opaque mobile payment capability
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayMobileSession" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "409":
          description: Booking cannot accept a new online payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /razorpay/mobile/exchange:
    post:
      operationId: exchangeRazorpayMobileSession
      tags: [bookings]
      summary: Exchange the one-time fragment capability for a scoped checkout token
      description: >
        The hosted /mobile-payment page posts the fragment token here once,
        then erases the fragment from browser history. The capability is
        single-use; the returned bearer is short-lived and scoped to its
        original user, booking, amount, and Razorpay mode.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RazorpayMobileExchangeInput" }
      responses:
        "200":
          description: Short-lived scoped checkout bearer
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayMobileExchange" }
        "401":
          description: Invalid, expired, revoked, or replayed capability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /razorpay/mobile/order:
    post:
      operationId: createRazorpayMobileOrder
      tags: [bookings]
      summary: Create the scoped hosted-browser Razorpay order
      description: >
        No booking id is accepted. Supply either Authorization: Bearer
        {checkoutToken} or X-Mobile-Checkout-Token: {checkoutToken}. The
        server derives and revalidates the original booking amount and mode.
        A canceled/revoked/completed session cannot create a new order.
      security:
        - MobileCheckoutToken: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileCheckoutTokenHeader"
      responses:
        "201":
          description: Razorpay checkout order
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayOrder" }
        "401":
          description: Invalid or expired checkout token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "409":
          description: Session or booking cannot create a new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /razorpay/mobile/verify:
    post:
      operationId: verifyRazorpayMobilePayment
      tags: [bookings]
      summary: Verify a scoped hosted-browser Razorpay result
      description: >
        Uses the same provider signature, exact-order, amount, mode, and
        immutable ledger service as the authenticated owner route. Verification
        remains available for a revoked/canceled session so a real late
        capture is recorded as refund_required rather than silently confirming
        the booking. Repeating a valid verification is idempotent.
      security:
        - MobileCheckoutToken: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileCheckoutTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RazorpayVerifyInput" }
      responses:
        "200":
          description: Verified payment status
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayPaymentStatus" }
        "400":
          description: Invalid signature, order, amount, or provider payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "401":
          description: Invalid or expired checkout token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /razorpay/mobile/status:
    get:
      operationId: getRazorpayMobilePaymentStatus
      tags: [bookings]
      summary: Reconcile a scoped hosted-browser Razorpay session
      description: >
        No booking id is accepted. This endpoint revalidates active-user
        ownership and polls all historical orders, including after a local
        paid state to surface duplicate or late captures.
      security:
        - MobileCheckoutToken: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileCheckoutTokenHeader"
      responses:
        "200":
          description: Current payment status
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RazorpayPaymentStatus" }
        "401":
          description: Invalid or expired checkout token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
