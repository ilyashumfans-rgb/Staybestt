    get:
      operationId: getProperty
      tags: [properties]
      summary: Property details with images, amenities, policies and rooms
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /availability:
    get:
      operationId: getAvailability
      tags: [rooms]
      summary: Room availability and pricing for a date range
      parameters:
        - name: propertyId
          in: query
          required: true
          schema: { type: integer }
        - name: checkIn
          in: query
          required: true
          schema: { type: string }
        - name: checkOut
          in: query
          required: true
          schema: { type: string }
        - name: guests
          in: query
