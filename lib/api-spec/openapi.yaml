      responses:
        "200":
          description: Home data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
  /properties:
    get:
      operationId: searchProperties
      tags: [properties]
      summary: Search and filter properties
      parameters:
        - name: q
          in: query
          description: Free-text search across name, city, area, landmark
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: category
          in: query
          description: Comma-separated categories (prime,luxury,budget,package)
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: minRating
          in: query
          schema: { type: number }
        - name: amenities
          in: query
          description: Comma-separated amenity names, property must have all
          schema: { type: string }
        - name: freeCancellation
          in: query
          schema: { type: boolean }
        - name: breakfastIncluded
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          description: One of distance, price_asc, price_desc, rating_desc, popular
          schema: { type: string }
        - name: latitude
          in: query
          description: Customer latitude for nearby-property search
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          description: Customer longitude for nearby-property search
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          description: Maximum nearby-search radius in kilometres
          schema: { type: number, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Matching properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertySummary"
