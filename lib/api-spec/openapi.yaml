  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: All registered users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserProfile" }
  /admin/users/invite:
    post:
      operationId: inviteUser
      tags: [admin]
      summary: Pre-provision a user (e.g. an employee) by email; the role applies when they sign up
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserInput" }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
  /admin/users/{id}/delete:
    post:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user account (customer, employee, or partner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "404":
          description: User not found
  /admin/users/{id}/role:
    post:
      operationId: updateUserRole
      tags: [admin]
      summary: Change a user's role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk-or-scoped-checkout-token
    MobileCheckoutToken:
      type: apiKey
      in: header
      name: X-Mobile-Checkout-Token
      description: Short-lived scoped checkout token returned by the mobile exchange endpoint.
  parameters:
    MobileCheckoutTokenHeader:
      name: X-Mobile-Checkout-Token
      in: header
      required: false
      description: >
        Short-lived scoped checkout bearer. Authorization: Bearer with the
        same token is also accepted; sending both with different values is
        rejected.
      schema: { type: string, minLength: 1, maxLength: 512 }
  schemas:
    BillingSettingsInput:
      type: object
      properties:
        businessName: { type: string, minLength: 1, maxLength: 200 }
        address: { type: string, minLength: 1, maxLength: 1000 }
        taxRegistration: { type: ["string", "null"], maxLength: 100 }
      required: [businessName, address]
    BillingSettings:
      allOf:
        - $ref: "#/components/schemas/BillingSettingsInput"
      type: object
      properties:
        id: { type: integer }
        updatedAt: { type: string }
      required: [id, businessName, address, taxRegistration, updatedAt]
    InvoiceLineInput:
      type: object
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        quantity: { type: integer, minimum: 1 }
        unitPriceMinor:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: INR paise, not rupees
        taxRateBps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
          description: Tax rate in basis points (100 bps = 1 percent)
      required: [description, quantity, unitPriceMinor]
    InvoiceInput:
      type: object
      properties:
        bookingId: { type: ["integer", "null"] }
        customerName: { type: string, minLength: 1, maxLength: 200 }
        customerEmail: { type: string, format: email, minLength: 3, maxLength: 320 }
        customerPhone: { type: ["string", "null"], maxLength: 50 }
        customerAddress: { type: ["string", "null"], maxLength: 1000 }
        issueDate: { type: string, description: "YYYY-MM-DD; defaults to today" }
        dueDate: { type: string, description: "YYYY-MM-DD" }
        lineItems:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/InvoiceLineInput" }
      required: [customerName, customerEmail, dueDate, lineItems]
    InvoicePaymentInput:
      type: object
      properties:
        amountMinor:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: INR paise, not rupees
        paymentDate: { type: string, description: "YYYY-MM-DD" }
        method: { type: string, enum: [cash, upi, bank, card, other] }
        reference: { type: ["string", "null"], maxLength: 200 }
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 200
          description: Stable client key; resubmission returns the original payment
      required: [amountMinor, paymentDate, method, idempotencyKey]
    InvoiceLine:
      allOf:
        - $ref: "#/components/schemas/InvoiceLineInput"
      type: object
      properties:
        id: { type: integer }
        taxRateBps: { type: integer }
        subtotalMinor: { type: integer }
        taxMinor: { type: integer }
        totalMinor: { type: integer }
      required: [id, description, quantity, unitPriceMinor, taxRateBps, subtotalMinor, taxMinor, totalMinor]
    InvoiceBooking:
      type: object
      properties:
        id: { type: integer }
        bookingRef: { type: ["string", "null"] }
        propertyName: { type: string }
        roomName: { type: string }
        checkIn: { type: string }
        checkOut: { type: string }
        totalMinor: { type: integer }
      required: [id, bookingRef, propertyName, roomName, checkIn, checkOut, totalMinor]
    InvoicePayment:
      type: object
      properties:
        id: { type: integer }
        amountMinor: { type: integer }
        paymentDate: { type: string }
        method: { type: string, enum: [cash, upi, bank, card, other, razorpay] }
        reference: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, amountMinor, paymentDate, method, reference, createdAt]
    ManualRefundInput:
      type: object
      properties:
        invoicePaymentId: { type: integer }
        amountMinor:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: INR paise, not rupees
        refundDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        reference: { type: ["string", "null"], maxLength: 200 }
        method: { $ref: "#/components/schemas/ManualRefundMethod" }
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 200
          description: Stable client key; an identical retry returns the original completed refund
      required: [invoicePaymentId, amountMinor, refundDate, reason, method, idempotencyKey]
    ManualRefundMethod:
      type: string
      enum: [cash, upi, bank, card, other]
    RecordedPaymentMethod:
      type: string
      enum: [cash, upi, bank, card, other, razorpay]
    BookingRefund:
      type: object
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        invoiceId: { type: integer }
        invoicePaymentId: { type: integer }
        amountMinor: { type: integer }
        refundDate: { type: string }
        reason: { type: string }
        reference: { type: ["string", "null"] }
        method: { $ref: "#/components/schemas/ManualRefundMethod" }
        actorUserId: { type: ["string", "null"] }
        idempotencyKey: { type: string }
        createdAt: { type: string }
      required:
        [id, bookingId, invoiceId, invoicePaymentId, amountMinor, refundDate, reason,
         reference, method, actorUserId, idempotencyKey, createdAt]
    BookingRefundPaymentSource:
      type: object
      properties:
        invoicePaymentId: { type: integer }
        invoiceId: { type: integer }
        invoiceNumber: { type: string }
        amountMinor: { type: integer }
        refundedMinor: { type: integer }
        remainingMinor: { type: integer }
        paymentDate: { type: string }
        method: { $ref: "#/components/schemas/RecordedPaymentMethod" }
        reference: { type: ["string", "null"] }
      required:
        [invoicePaymentId, invoiceId, invoiceNumber, amountMinor, refundedMinor, remainingMinor,
         paymentDate, method, reference]
    BookingRefundSummary:
      type: object
      properties:
        status: { type: string, enum: [none, partial, full] }
        grossPaidMinor: { type: integer }
        refundedMinor: { type: integer }
        netPaidMinor: { type: integer }
        remainingRefundableMinor: { type: integer }
        refundableReason: { type: ["string", "null"] }
        availablePaymentSources:
          type: array
          items: { $ref: "#/components/schemas/BookingRefundPaymentSource" }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/BookingRefund" }
      required:
        [status, grossPaidMinor, refundedMinor, netPaidMinor, remainingRefundableMinor,
         refundableReason, availablePaymentSources, refunds]
    Invoice:
      type: object
      properties:
        id: { type: integer }
        invoiceNumber: { type: string }
        bookingId: { type: ["integer", "null"] }
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: ["string", "null"] }
        customerAddress: { type: ["string", "null"] }
        issueDate: { type: string }
        dueDate: { type: string }
        currency: { type: string, enum: [INR] }
        subtotalMinor: { type: integer }
        taxMinor: { type: integer }
        totalMinor: { type: integer }
        paidMinor: { type: integer, description: Backward-compatible gross recorded payments total; use netPaidMinor for money retained }
        dueMinor: { type: integer }
        grossPaidMinor: { type: integer, description: Gross recorded payments; paidMinor remains as a backward-compatible alias }
        refundedMinor: { type: integer }
        netPaidMinor: { type: integer, description: Gross recorded payments minus completed refunds }
        status: { type: string, enum: [unpaid, partial, paid, overdue] }
        lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
        payments: { type: array, items: { $ref: "#/components/schemas/InvoicePayment" } }
        refunds: { type: array, items: { $ref: "#/components/schemas/BookingRefund" } }
        booking: { allOf: [{ $ref: "#/components/schemas/InvoiceBooking" }], nullable: true }
        createdAt: { type: string }
      required:
        [id, invoiceNumber, bookingId, customerName, customerEmail, customerPhone, customerAddress,
         issueDate, dueDate, currency, subtotalMinor, taxMinor, totalMinor, paidMinor, dueMinor,
         grossPaidMinor, refundedMinor, netPaidMinor, status, lines, payments, refunds, booking, createdAt]
    InvoiceEmailStatus:
      type: object
      properties:
        status: { type: string, enum: [unavailable] }
        configured: { type: boolean, enum: [false] }
        message: { type: string }
      required: [status, configured, message]
    UserPreferences:
      type: object
      properties:
        travelStyle: { type: string }
        preferredCategories:
          type: array
          items: { type: string }
        budgetRange: { type: string }
        dietaryNotes: { type: string }
        notifyOffers: { type: boolean }
        notifyBookingUpdates: { type: boolean }
        notifyReminders: { type: boolean }
    UpdateMeInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        preferences: { $ref: "#/components/schemas/UserPreferences" }
    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [customer, partner, agent, employee, admin] }
        preferences: { $ref: "#/components/schemas/UserPreferences" }
      required: [id, email, name, role]
    PropertyStatusInput:
      type: object
      properties:
        status: { type: string, enum: [pending, approved, active, suspended, rejected] }
      required: [status]
    CreateVendorInput:
      type: object
      properties:
        email: { type: string, minLength: 3 }
        username: { type: string, minLength: 3 }
        name: { type: string }
    PartnerLoginInput:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    PartnerLoginResult:
      type: object
      required: [ticket]
      properties:
        ticket: { type: string }
    VendorCredentials:
      type: object
      properties:
        email: { type: string }
        username: { type: string }
        password: { type: string }
        name: { type: string }
      required: [email, password, name]
    VendorCredentialRecord:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        password: { type: ["string", "null"], description: "null when the vendor signed up themselves" }
        updatedAt: { type: ["string", "null"] }
      required: [userId, email, name]
    SetVendorPasswordInput:
      type: object
      properties:
        password: { type: ["string", "null"], minLength: 8, description: "omit to auto-generate" }
    SeasonalRate:
      type: object
      properties:
        id: { type: integer }
        roomId: { type: integer }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        pricePerNight: { type: number }
      required: [id, roomId, name, startDate, endDate, pricePerNight]
    SeasonalRateInput:
      type: object
      properties:
        roomId: { type: integer }
        name: { type: string, minLength: 1 }
        startDate: { type: string, minLength: 10 }
        endDate: { type: string, minLength: 10 }
        pricePerNight: { type: number, minimum: 1 }
      required: [roomId, name, startDate, endDate, pricePerNight]
    PartnerFinance:
      type: object
      properties:
        totalEarnings: { type: number }
        commissionPct: { type: number }
        totalCommission: { type: number }
        netPayable: { type: number }
        completedBookings: { type: integer }
        upcomingRevenue: { type: number }
        settlements:
          type: array
          items: { $ref: "#/components/schemas/SettlementRow" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentRow" }
      required:
        [totalEarnings, commissionPct, totalCommission, netPayable, completedBookings, upcomingRevenue, settlements, payments]
    SettlementRow:
      type: object
      properties:
        period: { type: string }
        bookings: { type: integer }
        gross: { type: number }
        commission: { type: number }
        net: { type: number }
      required: [period, bookings, gross, commission, net]
    PaymentRow:
      type: object
      properties:
        bookingRef: { type: ["string", "null"] }
        date: { type: string }
        guestName: { type: string }
        propertyName: { type: string }
        amount: { type: number }
        status: { type: string }
      required: [bookingRef, date, guestName, propertyName, amount, status]
    PartnerProfile:
      type: object
