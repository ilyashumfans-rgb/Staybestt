        activeEmployees: { type: integer }
        exitedEmployees: { type: integer }
        annualCtc: { type: number }
        averageCtc: { type: number }
      required: [employees, activeEmployees, exitedEmployees, annualCtc, averageCtc]
    EmployeeReportRow:
      type: object
      properties:
        id: { type: integer }
        employeeCode: { type: string }
        name: { type: string }
        email: { type: string }
        designation: { type: string }
        department: { type: string }
        joiningDate: { type: ["string", "null"] }
        exitDate: { type: ["string", "null"] }
        status: { type: string }
        ctcAnnual: { type: ["number", "null"] }
      required: [id, employeeCode, name, email, designation, department, joiningDate, exitDate, status, ctcAnnual]
    EmployeeReport:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/EmployeeReportSummary" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/EmployeeReportRow" }
      required: [summary, rows]
    RefundReportSummary:
      type: object
      properties:
        refundedTransactions: { type: integer }
        distinctBookings: { type: integer }
        refundedAmountMinor: { type: integer, description: INR paise returned by completed manual refunds }
      required: [refundedTransactions, distinctBookings, refundedAmountMinor]
    RefundReportBreakdownRow:
      type: object
      properties:
        period: { type: string }
        refundedTransactions: { type: integer }
        distinctBookings: { type: integer }
        refundedAmountMinor: { type: integer }
      required: [period, refundedTransactions, distinctBookings, refundedAmountMinor]
    RefundReportRow:
      type: object
      properties:
        id: { type: integer }
        refundDate: { type: string }
        bookingId: { type: integer }
        bookingRef: { type: ["string", "null"] }
        invoiceId: { type: integer }
        invoicePaymentId: { type: integer }
        propertyId: { type: integer }
        propertyName: { type: string }
        guestName: { type: string }
        guestEmail: { type: string }
        bookingStatus: { type: string }
        amountMinor: { type: integer }
        method: { $ref: "#/components/schemas/ManualRefundMethod" }
        reason: { type: string }
        reference: { type: ["string", "null"] }
        actorUserId: { type: ["string", "null"] }
        createdAt: { type: string }
      required:
        [id, refundDate, bookingId, bookingRef, invoiceId, invoicePaymentId, propertyId,
         propertyName, guestName, guestEmail, bookingStatus, amountMinor, method, reason,
         reference, actorUserId, createdAt]
    RefundReport:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/RefundReportSummary" }
        breakdown:
          type: array
          items: { $ref: "#/components/schemas/RefundReportBreakdownRow" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/RefundReportRow" }
      required: [summary, breakdown, rows]
    BusinessReportFilters:
      type: object
      properties:
        properties:
          type: array
          items: { $ref: "#/components/schemas/BusinessReportPropertyOption" }
        departments:
