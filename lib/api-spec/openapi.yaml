        name: { type: string }
        email: { type: string }
        status: { type: string }
        joinedAt: { type: string }
        bookings: { type: integer }
        bookingValue: { type: number }
        lastBookingAt: { type: ["string", "null"] }
      required: [id, name, email, status, joinedAt, bookings, bookingValue, lastBookingAt]
    CustomerReport:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/CustomerReportSummary" }
        rows:
