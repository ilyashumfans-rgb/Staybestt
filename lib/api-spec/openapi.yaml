openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StayBest resort & hotel booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: properties
  - name: rooms
  - name: bookings
  - name: reviews
  - name: wishlist
  - name: home
  - name: admin
  - name: Storage
  - name: assistant
  - name: agent
  - name: employee
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /admin/property-documents/properties:
    get:
      operationId: listAdminPropertyDocumentProperties
      tags: [admin]
      summary: Property selector for property document administration
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyDocumentProperty" }
  /admin/property-documents:
    get:
      operationId: listAdminPropertyDocuments
      tags: [admin]
      summary: List all property documents
      parameters:
        - name: propertyId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyDocument" }
  /admin/property-documents/upload-grants:
    get:
      operationId: listPropertyDocumentUploadGrants
      tags: [admin]
      summary: List employee users and property document upload grants
      responses:
        "200":
          description: Employees and grant state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyDocumentUploadGrant" }
  /admin/property-documents/upload-grants/{userId}:
    post:
      operationId: grantPropertyDocumentUpload
      tags: [admin]
      summary: Grant property document uploads to an employee user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocumentUploadGrant" }
    delete:
      operationId: revokePropertyDocumentUpload
      tags: [admin]
      summary: Revoke property document uploads from an employee user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocumentUploadGrant" }
  /admin/property-documents/upload-intents:
    post:
      operationId: createAdminPropertyDocumentUploadIntent
      tags: [admin]
      summary: Create a private property document staging upload intent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyDocumentUploadIntentInput" }
      responses:
        "201":
          description: Authenticated bounded upload intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocumentUploadIntent" }
  /admin/property-documents/upload-intents/{intentId}/finalize:
    post:
      operationId: finalizeAdminPropertyDocumentUpload
      tags: [admin]
      summary: Validate and finalize a property document upload
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Finalized pending document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocument" }
  /admin/property-documents/upload-intents/{intentId}/content:
    put:
      operationId: uploadAdminPropertyDocumentContent
      tags: [admin]
      summary: Stream bounded document bytes into private staging storage
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Staged document bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocumentUploadContentResponse" }
  /admin/property-documents/{documentId}/download:
    get:
      operationId: downloadAdminPropertyDocument
      tags: [admin]
      summary: Authenticated property document download
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private document attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /admin/property-documents/{documentId}/review:
    post:
      operationId: reviewPropertyDocument
      tags: [admin]
      summary: Approve or reject a pending property document
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyDocumentReviewInput" }
      responses:
        "200":
          description: Reviewed document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocument" }
  /employee/property-documents/properties:
    get:
      operationId: listEmployeePropertyDocumentProperties
      tags: [employee]
      summary: Minimal property selector for employee document uploads
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyDocumentProperty" }
  /employee/property-documents:
    get:
      operationId: listEmployeePropertyDocuments
      tags: [employee]
      summary: List only the authenticated employee's uploads
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyDocument" }
  /employee/property-documents/upload-intents:
    post:
      operationId: createEmployeePropertyDocumentUploadIntent
      tags: [employee]
      summary: Create an employee property document staging upload intent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyDocumentUploadIntentInput" }
      responses:
        "201":
          description: Authenticated bounded upload intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocumentUploadIntent" }
  /employee/property-documents/upload-intents/{intentId}/finalize:
    post:
      operationId: finalizeEmployeePropertyDocumentUpload
      tags: [employee]
      summary: Validate and finalize an employee property document upload
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Finalized pending document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocument" }
  /employee/property-documents/upload-intents/{intentId}/content:
    put:
      operationId: uploadEmployeePropertyDocumentContent
      tags: [employee]
      summary: Stream bounded document bytes into private staging storage
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Staged document bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDocumentUploadContentResponse" }
  /employee/property-documents/{documentId}/download:
    get:
      operationId: downloadEmployeePropertyDocument
      tags: [employee]
      summary: Authenticated employee property document download
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private document attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Log in with admin username and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginInput" }
      responses:
        "200":
          description: Credentials valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLoginResult" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }
  /admin/bookings:
    get:
      operationId: listAdminBookings
      tags: [admin]
      summary: All bookings, newest first
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
  /admin/bookings/{id}/status:
    post:
      operationId: updateBookingStatus
      tags: [admin]
      summary: Update a booking status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingStatusInput" }
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
  /admin/bookings/{id}:
    get:
      operationId: getAdminBooking
      tags: [admin]
      summary: Get one booking with its payment summary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/bookings/{id}/refunds:
    get:
      operationId: getAdminBookingRefunds
      tags: [admin]
      summary: Get refund summary, immutable manual refund history, and refundable payment sources
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Refund summary and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingRefundSummary" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
    post:
      operationId: createAdminBookingRefund
      tags: [admin]
      summary: Complete one immutable manual refund against a recorded invoice payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualRefundInput" }
      responses:
        "201":
          description: Refund completed, or the existing refund for a repeated idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingRefundSummary" }
        "404":
          description: Booking not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
        "409":
          description: Idempotency mismatch, unavailable source, or over-refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/billing-settings:
    get:
      operationId: getBillingSettings
      tags: [admin]
      summary: Get company billing settings
      responses:
        "200":
          description: Billing settings, or an unconfigured response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSettings" }
        "404":
          description: Billing settings have not been configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
    put:
      operationId: updateBillingSettings
      tags: [admin]
      summary: Set company billing settings used on future invoice PDFs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingSettingsInput" }
      responses:
        "200":
          description: Updated billing settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSettings" }
  /admin/invoices:
    get:
      operationId: listAdminInvoices
      tags: [admin]
      summary: List admin invoices with computed payment status
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unpaid, partial, paid, overdue]
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createAdminInvoice
      tags: [admin]
      summary: Create an invoice with server-computed INR totals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /admin/invoices/{id}:
    get:
      operationId: getAdminInvoice
      tags: [admin]
      summary: Get an invoice, line items, and manual payments
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /admin/invoices/{id}/payments:
    post:
      operationId: recordInvoicePayment
      tags: [admin]
      summary: Record one manual invoice payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoicePaymentInput" }
      responses:
        "201":
          description: Invoice after recording the payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409":
          description: Duplicate submission, status changed, or amount exceeds balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/invoices/{id}/pdf:
    get:
      operationId: downloadInvoicePdf
      tags: [admin]
      summary: Generate and download a branded invoice PDF on demand
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Branded invoice PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409":
          description: Billing settings are not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/invoices/{id}/email-status:
    get:
      operationId: getInvoiceEmailStatus
      tags: [admin]
      summary: Report whether invoice email delivery is configured
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Email delivery availability (currently unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceEmailStatus" }
  /admin/invoices/{id}/email:
    post:
      operationId: sendInvoiceEmail
      tags: [admin]
      summary: Send an invoice email when a provider is configured
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "503":
          description: Email provider is not configured; no email was sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /locations:
    get:
      operationId: listLocations
      tags: [properties]
      summary: Approved city/area/pincode options with optional districts (public)
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
  /postal-directory:
    get:
      operationId: listPostalDirectory
      tags: [properties]
      summary: Browse approved current rows from the checked-in India Post office directory
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: cityOrTaluk, in: query, schema: { type: string } }
        - { name: officeName, in: query, schema: { type: string } }
        - { name: pincode, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: A page of office-level directory rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostalDirectoryPage" }
  /postal-directory/states:
    get:
      operationId: listPostalDirectoryStates
      tags: [properties]
      summary: List states and row counts for approved current directory rows
      responses:
        "200":
          description: State hierarchy options
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PostalDirectoryState" }
  /postal-directory/districts:
    get:
      operationId: listPostalDirectoryDistricts
      tags: [properties]
      summary: List districts for approved current directory rows, optionally filtered by state
      parameters:
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: District hierarchy options
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PostalDirectoryDistrict" }
  /property-categories:
    get:
      operationId: listPropertyCategories
      tags: [properties]
      summary: Active property categories
      responses:
        "200":
          description: Property categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyCategory" }
  /admin/property-categories:
    get:
      operationId: listAdminPropertyCategories
      tags: [admin]
      summary: All property categories
      responses:
        "200":
          description: Property categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PropertyCategory" }
    post:
      operationId: createPropertyCategory
      tags: [admin]
      summary: Create a property category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyCategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyCategory" }
  /admin/property-categories/{id}:
    put:
      operationId: updatePropertyCategory
      tags: [admin]
      summary: Update a property category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyCategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyCategory" }
    delete:
      operationId: deletePropertyCategory
      tags: [admin]
      summary: Delete an unused property category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/locations:
    get:
      operationId: listAdminLocations
      tags: [admin]
      summary: All managed locations, including approval state and directory links
      responses:
        "200":
          description: Managed locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminLocation" }
    post:
      operationId: createLocation
      tags: [admin]
      summary: Add a city/area/pincode option with an optional district
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
  /admin/locations/{id}:
    put:
      operationId: updateLocation
      tags: [admin]
      summary: Update a city/area/pincode option with an optional district
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
  /admin/locations/{id}/delete:
    post:
      operationId: deleteLocation
      tags: [admin]
      summary: Remove a city/area/pincode option
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/locations/{id}/approval:
    post:
      operationId: setLocationApproval
      tags: [admin]
      summary: Approve or unapprove a manually managed location
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationApprovalInput" }
      responses:
        "200":
          description: Updated managed location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLocation" }
        "409":
          description: Directory-linked location or duplicate tuple
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMessage" }
  /admin/postal-directory:
    get:
      operationId: listAdminPostalDirectory
      tags: [admin]
      summary: Browse and filter current India Post rows for approval
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: cityOrTaluk, in: query, schema: { type: string } }
        - { name: officeName, in: query, schema: { type: string } }
        - { name: pincode, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: approved, in: query, schema: { type: boolean } }
        - { name: includeRetired, in: query, schema: { type: boolean, default: false } }
